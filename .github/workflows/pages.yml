name: Build and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The gate has to be able to fail the deploy, so the money math and the
      # duplicate-number rule run before anything ships.
      - run: npm test
      # The UI audit needs a browser. --with-deps pulls the system libraries
      # Chromium needs on a bare runner; without it the launch fails and the
      # audit exits 2, which reads as "could not run", not as a pass.
      - run: npx playwright install --with-deps chromium
      # Builds the app with a dummy Vision key, then walks every screen at
      # 390x844. Fails the deploy on clipped text, a tap target under 44px, a
      # control that would make iOS zoom, or type off the scale.
      - run: npm run audit:ui
      # And proves the checks still fire when the thing they watch is broken.
      # A suite that cannot fail would pass this gate forever.
      - run: npm run audit:ui -- --self-test --keep
      # The Vision key is injected here rather than committed. It still ends up
      # in the published bundle — a browser call cannot hide it — so what
      # actually protects it is the HTTP-referrer restriction and the Vision
      # quota cap, both set in the Google Cloud console.
      - run: npm run build
        env:
          VITE_VISION_KEY: ${{ secrets.VISION_API_KEY }}
      # The interaction specs ship alongside the app rather than being replaced by it.
      - run: cp -r design dist/design
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
