<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the safe-area insets in styles.css have something to do -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Number-keyed, offline-first table tool for sports card show dealers.">
<meta name="theme-color" content="#F2F2EF">
<!-- Add to Home Screen is a requirement here, not a suggestion: iOS caps
     script-writable storage at seven days of inactivity for a browser tab,
     while an installed home-screen app gets a days-of-use counter that resets
     on real use. A dealer who works one show a month must not find an empty case. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SHOWKARDZ">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-512.png">
<title>SHOWKARDZ</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
